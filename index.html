<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>¡Rancaguazo 2026!</title>
<!-- Vista previa al compartir por WhatsApp -->
<meta property="og:title" content="¡Rancaguazo 2026!">
<meta property="og:description" content="Cuenta regresiva para que lleguen los chupa poto · 02-10-2026 13:00 (America/Santiago)">
<meta property="og:type" content="website">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, #1e293b, #0f172a); color: #f8fafc;
    padding: 16px; text-align: center;
  }
  h1 { font-size: clamp(1.6rem, 6vw, 2.8rem); margin-bottom: 8px; }
  .sub { opacity: .8; margin-bottom: 28px; }
  .grid { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .box {
    background: rgba(255,255,255,.08); border-radius: 14px;
    padding: 16px 10px; min-width: 76px;
  }
  .num { font-size: clamp(2rem, 9vw, 3.5rem); font-weight: 700;
          font-variant-numeric: tabular-nums; }
  .lbl { font-size: .8rem; text-transform: uppercase; letter-spacing: 1px; opacity: .7; }
  .fecha { margin-top: 24px; font-size: .85rem; opacity: .6; }
  .fin { font-size: clamp(1.6rem, 7vw, 2.6rem); font-weight: 700; }
</style>
</head>
<body>
  <main>
    <h1>¡Rancaguazo 2026!</h1>
    <p class="sub">Cuenta regresiva para que lleguen los chupa poto</p>
    <div id="cuenta" class="grid">
      <div class="box"><div class="num" id="d">--</div><div class="lbl">Días</div></div>
      <div class="box"><div class="num" id="h">--</div><div class="lbl">Horas</div></div>
      <div class="box"><div class="num" id="m">--</div><div class="lbl">Minutos</div></div>
      <div class="box"><div class="num" id="s">--</div><div class="lbl">Segundos</div></div>
    </div>
    <p class="fecha">Objetivo: 02-10-2026 13:00 (America/Santiago)</p>
  </main>
<script>
  const OBJETIVO = 1790956800000;
  const MENSAJE_FINAL = "\u00a1Lleg\u00f3 el momento! \ud83c\udf89";
  const pad = n => String(n).padStart(2, "0");

  function actualizar() {
    const resto = OBJETIVO - Date.now();
    if (resto <= 0) {
      document.getElementById("cuenta").innerHTML =
        '<div class="fin"></div>';
      document.querySelector(".fin").textContent = MENSAJE_FINAL;
      clearInterval(timer);
      return;
    }
    const seg = Math.floor(resto / 1000);
    document.getElementById("d").textContent = Math.floor(seg / 86400);
    document.getElementById("h").textContent = pad(Math.floor(seg % 86400 / 3600));
    document.getElementById("m").textContent = pad(Math.floor(seg % 3600 / 60));
    document.getElementById("s").textContent = pad(seg % 60);
  }
  const timer = setInterval(actualizar, 1000);
  actualizar();
</script>
</body>
</html>
