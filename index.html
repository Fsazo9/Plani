<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Resumen Tableros Planificación — Monday</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f4f6f9;--card:#fff;--line:#e3e8ef;--line2:#cfd7e3;
  --ink:#0f172a;--ink2:#475569;--ink3:#8492a6;
  --navy:#1e3a8a;--navy2:#2547a8;--navy-soft:#eef2fb;
  --ok:#15803d;--late:#b7791f;--over:#c62828;--soon:#ea6a0c;--plazo:#2563eb;--na:#9aa5b4;--dne:#5fae84;
  --r:10px;--font:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.4}
button{font-family:inherit;cursor:pointer}
input,select{font-family:inherit}
.hidden{display:none!important}

/* ── header ── */
.hdr{background:var(--card);border-bottom:1px solid var(--line);padding:.7rem 1.4rem;display:flex;align-items:center;gap:1rem;position:sticky;top:0;z-index:50}
.hdr h1{font-size:1.02rem;font-weight:700;letter-spacing:.01em}
.hdr h1 small{display:block;font-size:.72rem;font-weight:400;color:var(--ink3);margin-top:.1rem}
.hdr .sp{flex:1}
.btn{border:1px solid var(--line2);background:var(--card);color:var(--ink);border-radius:8px;padding:.42rem .85rem;font-size:.8rem;font-weight:600;display:inline-flex;align-items:center;gap:.4rem;transition:.15s}
.btn:hover{border-color:var(--navy);color:var(--navy)}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.pri:hover{background:var(--navy2);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:.25rem .6rem;font-size:.74rem;font-weight:500}

/* ── setup ── */
.setup{max-width:980px;margin:1.6rem auto;padding:0 1rem;display:flex;flex-direction:column;gap:1rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:1.2rem 1.3rem}
.step-h{display:flex;align-items:center;gap:.6rem;margin-bottom:.8rem}
.step-n{width:24px;height:24px;border-radius:50%;background:var(--navy);color:#fff;font-size:.75rem;font-weight:700;display:flex;align-items:center;justify-content:center}
.step-h h2{font-size:.95rem}
.step-h .muted{margin-left:auto}
.muted{color:var(--ink3);font-size:.76rem}
.field{display:flex;flex-direction:column;gap:.3rem;margin-bottom:.8rem}
.field label{font-size:.72rem;font-weight:700;color:var(--ink2);text-transform:uppercase;letter-spacing:.05em}
.inp{border:1px solid var(--line2);border-radius:8px;padding:.5rem .7rem;font-size:.85rem;outline:none;background:#fff;color:var(--ink)}
.inp:focus{border-color:var(--navy)}
.chk{display:flex;align-items:center;gap:.45rem;font-size:.8rem;color:var(--ink2);margin-bottom:.4rem}
.chk input{accent-color:var(--navy)}
.row{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
.status{margin-top:.6rem;font-size:.8rem;color:var(--ink2);min-height:1.2em}
.status.err{color:var(--over)}
.ws-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:.45rem;max-height:300px;overflow:auto;padding:.1rem}
.opt{display:flex;align-items:center;gap:.5rem;border:1px solid var(--line);border-radius:8px;padding:.45rem .6rem;cursor:pointer;font-size:.82rem}
.opt:hover{border-color:var(--navy)}
.opt:has(input:checked){border-color:var(--navy);background:var(--navy-soft)}
.opt input{accent-color:var(--navy)}
.opt .tag{margin-left:auto;font-size:.68rem;color:var(--ink3)}
.btbl-wrap{max-height:380px;overflow:auto;border:1px solid var(--line);border-radius:8px;margin-top:.6rem}
.progress{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:.6rem}
.progress div{height:100%;width:0;background:var(--navy);transition:width .25s}

/* ── menú de módulos (páginas) ── */
.modnav{display:flex;gap:.25rem;background:#eef1f6;border-radius:10px;padding:.25rem;margin-left:1rem}
.modnav button{border:none;background:none;border-radius:8px;padding:.45rem 1rem;font-size:.82rem;font-weight:600;color:var(--ink2);display:flex;align-items:center;gap:.45rem}
.modnav button:hover{color:var(--navy)}
.modnav button.on{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(15,23,42,.12)}
.modnav .badge{background:var(--over);color:#fff;border-radius:99px;font-size:.66rem;padding:.05rem .45rem}
.pagehead{display:flex;align-items:flex-end;gap:1rem;flex-wrap:wrap;margin-bottom:.9rem}
.pagehead h2{font-size:1.25rem;font-weight:700}
.pagehead p{font-size:.78rem;color:var(--ink3);margin-top:.15rem;max-width:720px}
.pagehead .ctl{margin-left:auto;display:flex;gap:.45rem;align-items:center;flex-wrap:wrap}
.pagehead.alr h2{color:var(--over)}
/* ── filtro de rango de fechas ── */
#dpop h4{font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--ink2);margin:.15rem 0 .1rem}
#dpop .presets{display:grid;grid-template-columns:repeat(3,1fr);gap:.3rem}
#dpop .presets button{border:1px solid var(--line2);background:#fff;border-radius:6px;padding:.3rem .2rem;font-size:.72rem;color:var(--ink2)}
#dpop .presets button:hover{border-color:var(--navy);color:var(--navy)}
#dpop .presets button.on{background:var(--navy-soft);border-color:var(--navy);color:var(--navy);font-weight:600}
#dpop .dr{display:flex;gap:.4rem;align-items:center}
#dpop .dr input{flex:1;border:1px solid var(--line2);border-radius:6px;padding:.3rem .4rem;font-size:.78rem}
/* ── app ── */
.fbar{background:var(--card);border-bottom:1px solid var(--line);padding:.6rem 1.4rem;display:flex;flex-wrap:wrap;gap:.45rem;align-items:center;position:sticky;top:57px;z-index:40}
.fbtn{border:1px solid var(--line2);background:#fff;border-radius:99px;padding:.28rem .7rem;font-size:.76rem;color:var(--ink2);display:inline-flex;gap:.3rem;align-items:center}
.fbtn:hover{border-color:var(--navy);color:var(--navy)}
.fbtn.on{background:var(--navy-soft);border-color:var(--navy);color:var(--navy);font-weight:600}
.fbtn .cnt{background:var(--navy);color:#fff;border-radius:99px;font-size:.64rem;padding:0 .38rem}
.fsearch{border:1px solid var(--line2);border-radius:99px;padding:.3rem .8rem;font-size:.78rem;width:200px;outline:none}
.fsearch:focus{border-color:var(--navy)}
.fdate{border:1px solid var(--line2);border-radius:6px;padding:.22rem .4rem;font-size:.74rem;color:var(--ink2)}
.fsep{width:1px;height:20px;background:var(--line)}
.fcount{margin-left:auto;font-size:.76rem;color:var(--ink2);font-weight:600}
.notice{font-size:.74rem;color:var(--ink3);padding:.35rem 1.4rem 0}

.pop{position:absolute;z-index:200;background:#fff;border:1px solid var(--line2);border-radius:10px;box-shadow:0 10px 30px rgba(15,23,42,.15);width:290px;max-height:380px;display:flex;flex-direction:column;padding:.5rem;gap:.4rem}
.pop .list{overflow:auto;flex:1;display:flex;flex-direction:column}
.pop label{display:flex;align-items:center;gap:.45rem;font-size:.78rem;padding:.25rem .3rem;border-radius:5px;cursor:pointer}
.pop label:hover{background:var(--navy-soft)}
.pop label span.n{margin-left:auto;color:var(--ink3);font-size:.7rem}
.pop .foot{display:flex;gap:.35rem;border-top:1px solid var(--line);padding-top:.4rem}
.pop .foot .btn{flex:1;justify-content:center}

.main{padding:1rem 1.4rem 3rem}
.tabs{display:flex;gap:.2rem;border-bottom:1px solid var(--line);margin-bottom:1rem}
.tab{background:none;border:none;border-bottom:2px solid transparent;padding:.55rem .95rem;font-size:.82rem;color:var(--ink2);font-weight:600}
.tab:hover{color:var(--navy)}
.tab.on{color:var(--navy);border-bottom-color:var(--navy)}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.7rem;margin-bottom:1rem}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:.85rem 1rem;position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c,var(--navy))}
.kpi .v{font-size:1.65rem;font-weight:700;line-height:1.1;color:var(--ink)}
.kpi .l{font-size:.7rem;color:var(--ink2);font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-top:.25rem}
.kpi .s{font-size:.72rem;color:var(--ink3);margin-top:.2rem}

.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:.9rem}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:.9rem 1rem}
.panel h3{font-size:.8rem;font-weight:700;color:var(--ink);margin-bottom:.15rem}
.panel .sub{font-size:.72rem;color:var(--ink3);margin-bottom:.6rem}
.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
@media(max-width:1000px){.c4,.c5,.c6,.c7,.c8{grid-column:span 12}}
.cv{position:relative;height:260px}.cv.t{height:320px}
.cv canvas{cursor:pointer}

/* tables */
.twrap{overflow:auto;border:1px solid var(--line);border-radius:8px}
table{width:100%;border-collapse:collapse;font-size:.78rem}
th{background:#f7f9fc;color:var(--ink2);font-weight:700;text-align:left;padding:.5rem .6rem;border-bottom:1px solid var(--line2);white-space:nowrap;position:sticky;top:0;cursor:pointer;user-select:none;font-size:.72rem}
th.num,td.num{text-align:right}
th:hover{color:var(--navy)}
th .ar{opacity:.35;font-size:.65rem;margin-left:.2rem}
th.sorted .ar{opacity:1;color:var(--navy)}
td{padding:.42rem .6rem;border-bottom:1px solid #eef1f5;white-space:nowrap;color:var(--ink)}
td.wrap{white-space:normal;min-width:220px}
tbody tr:hover td{background:#f8fafd}
tfoot td{font-weight:700;background:#f7f9fc;border-top:1px solid var(--line2)}
.pbar{display:flex;align-items:center;gap:.45rem;justify-content:flex-end}
.pbar .b{width:60px;height:6px;background:#edf0f4;border-radius:99px;overflow:hidden}
.pbar .b i{display:block;height:100%}
.pill{display:inline-block;border-radius:99px;padding:.08rem .5rem;font-size:.7rem;font-weight:600;color:#fff}
.dpos{color:var(--over);font-weight:700}
.pager{display:flex;align-items:center;gap:.5rem;justify-content:flex-end;margin-top:.5rem;font-size:.76rem;color:var(--ink2)}
.tinfo{font-size:.74rem;color:var(--ink3);margin:.2rem 0 .45rem}
.empty{padding:2rem;text-align:center;color:var(--ink3)}
.sec-title{font-size:.86rem;font-weight:700;margin:1.1rem 0 .4rem}

@media print{
  .hdr .btn,.fbar,.tabs,.notice{display:none!important}
  .hdr{position:static}
  body{background:#fff}
  .panel,.kpi{break-inside:avoid}
}
</style>
</head>
<body>

<header class="hdr">
  <h1>Resumen Tableros Planificación<small id="hdrMeta">Monday · Cumplimiento de plazos planificado vs real</small></h1>
  <nav class="modnav hidden" id="modnav"></nav>
  <div class="sp"></div>
  <button class="btn hidden" id="bConfig">⚙ Configuración</button>
  <button class="btn hidden" id="bRefresh">↻ Actualizar</button>
  <button class="btn hidden" id="bPrint">🖨 PDF</button>
  <button class="btn pri hidden" id="bExcel">⬇ Excel</button>
</header>

<!-- ═══════════ SETUP ═══════════ -->
<section class="setup" id="setup">
  <div class="card">
    <div class="step-h"><div class="step-n">1</div><h2>Ingreso a Monday</h2></div>
    <div class="field">
      <label>API key personal</label>
      <input class="inp" type="password" id="apikey" placeholder="eyJhbGciOiJIUzI1NiJ9…" autocomplete="off"/>
      <span class="muted">.</span>
    </div>
    <label class="chk"><input type="checkbox" id="saveKey" checked/> Recordar API key en este navegador</label>
    <label class="chk"><input type="checkbox" id="useProxy"/> Usar proxy CORS (solo si abres el archivo localmente y falla la conexión — la key pasa por un servicio de terceros)</label>
    <div class="row" style="margin-top:.4rem">
      <button class="btn pri" id="bConnect">Conectar</button>
    </div>
    <div class="status" id="st1"></div>
  </div>

  <div class="card hidden" id="cardWs">
    <div class="step-h"><div class="step-n">2</div><h2>Espacios de trabajo</h2><span class="muted" id="wsCount"></span></div>
    <div class="row" style="margin-bottom:.6rem">
      <input class="inp" id="wsSearch" placeholder="Buscar espacio…" style="flex:1;min-width:200px"/>
      <button class="btn sm" id="wsAll">Todos</button>
      <button class="btn sm" id="wsNone">Ninguno</button>
    </div>
    <div class="ws-grid" id="wsList"></div>
    <div class="row" style="margin-top:.8rem"><button class="btn pri" id="bBoards">Buscar tableros</button></div>
    <div class="status" id="st2"></div>
  </div>

  <div class="card hidden" id="cardBoards">
    <div class="step-h"><div class="step-n">3</div><h2>Tableros a analizar</h2><span class="muted" id="bCount"></span></div>
    <div class="row">
      <input class="inp" id="bSearch" placeholder="Buscar tablero…" style="flex:1;min-width:200px"/>
      <select class="inp" id="bYear"><option value="">Todos los años</option></select>
      <label class="chk" style="margin:0"><input type="checkbox" id="bPattern" checked/> Solo tableros de proyecto <span class="muted">(nombre con [TIPO] (AAAA))</span></label>
    </div>
    <div class="row" style="margin-top:.4rem">
      <label class="chk" style="margin:0"><input type="checkbox" id="bNoPost" checked/> Excluir postergados <span class="muted">(nombre con POST o en carpeta POSTERGADOS)</span></label>
      <span class="muted" id="bPostInfo"></span>
    </div>
    <div class="row" style="margin-top:.5rem">
      <button class="btn sm" id="bAll">Seleccionar visibles</button>
      <button class="btn sm" id="bNone">Quitar visibles</button>
    </div>
    <div class="btbl-wrap"><table><thead><tr><th style="width:30px"></th><th>Tablero</th><th>Espacio</th><th>Carpeta</th><th>Año</th><th class="num">Ítems</th></tr></thead><tbody id="bList"></tbody></table></div>
    <div class="row" style="margin-top:.8rem">
      <button class="btn pri" id="bLoad">Cargar datos</button>
      <span class="muted">Tableros por consulta:</span>
      <input class="inp" type="number" id="batch" value="5" min="1" max="25" style="width:70px;padding:.3rem .5rem"/>
    </div>
    <div class="progress hidden" id="prog"><div></div></div>
    <div class="status" id="st3"></div>
  </div>
</section>

<!-- ═══════════ APP ═══════════ -->
<section class="hidden" id="app">
  <div class="fbar" id="fbar">
    <input class="fsearch" id="fq" placeholder="🔍 Buscar actividad, proyecto…"/>
    <span id="fbtns" style="display:contents"></span>
    <span class="fsep"></span>
    <button class="fbtn" id="fDate">📅 Rango de fechas ▾</button>
    <span class="fsep"></span>
    <label class="chk" style="margin:0"><input type="checkbox" id="fPlan" checked/> Solo etapas de planificación</label>
    <button class="btn sm" id="fClear">✕ Limpiar filtros</button>
    <span class="fcount" id="fcount"></span>
  </div>
  <div class="notice" id="notice"></div>
  <div class="main">
    <div class="pagehead" id="pagehead"></div>
    <div class="tabs" id="tabs"></div>
    <div id="view"></div>
  </div>
</section>

<div class="pop hidden" id="pop"></div>
<div class="pop hidden" id="dpop" style="width:340px;max-height:none"></div>

<script>
'use strict';
// ════════════════════════════════════════════════════════════
// CONFIG
// ════════════════════════════════════════════════════════════
const API='https://api.monday.com/v2';
const API_VER='2025-04';
const PAGE=500;                       // ítems por página (máx. API)
const ETAPAS=['Definición Proyecto','Diseño Operativo','Preparación Campaña','Enlace Operacional'];
const DONE=['validado','cerrado por planificacion','realizado','completado','terminado','finalizado','listo','hecho','done','cumplido','aprobado','cerrado'];
const EXCL=['cancelado','no aplica','n/a','anulado','descartado'];
const E={OK:'Cumplida a tiempo',LATE:'Cumplida con atraso',DNE:'Cumplida (sin fechas)',OVER:'Atrasada',SOON:'Por vencer (≤7 días)',PLAZO:'En plazo',ND:'Sin fecha plan'};
const E_ORDER=[E.OK,E.LATE,E.DNE,E.OVER,E.SOON,E.PLAZO,E.ND];
const E_CLR={[E.OK]:'#15803d',[E.LATE]:'#b7791f',[E.DNE]:'#5fae84',[E.OVER]:'#c62828',[E.SOON]:'#ea6a0c',[E.PLAZO]:'#2563eb',[E.ND]:'#9aa5b4'};
const FDEF=[
  {k:'year',l:'Año'},{k:'ws',l:'Espacio'},{k:'proj',l:'Proyecto'},{k:'etapa',l:'Etapa'},
  {k:'area',l:'Área'},{k:'resp',l:'Responsable'},{k:'avance',l:'Avance'},{k:'estado',l:'Estado plazo'},
];
let TODAY=new Date();TODAY.setHours(0,0,0,0);
function resetToday(){TODAY=new Date();TODAY.setHours(0,0,0,0);}   // se recalcula en cada carga/actualización
const DAY=86400000;

// ════════════════════════════════════════════════════════════
// STATE
// ════════════════════════════════════════════════════════════
const ST={key:'',proxy:false,ws:[],boards:[],selWs:new Set(),selBoards:new Set(),rows:[],loadedAt:null,nBoards:0,boardCols:{}};
const F={sel:{},q:'',from:null,to:null,dfield:'periodo',preset:'',onlyPlan:true};
FDEF.forEach(f=>F.sel[f.k]=new Set());
let FR=[],FRA=[];            // filas filtradas activas
let MOD='dash';                       // módulo / página activa
const TABSEL={dash:'res',alr:'resumen'};   // pestaña activa por módulo
const CH={};          // charts
const TD={};          // tablas {cols,data,opts,sort,dir,page}

// ════════════════════════════════════════════════════════════
// HELPERS
// ════════════════════════════════════════════════════════════
const $=s=>document.querySelector(s);
const norm=s=>String(s??'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const pct=(n,d)=>d?n/d*100:null;
const fP=v=>v==null?'—':v.toFixed(1).replace('.',',')+'%';
const fN=v=>v==null?'—':Number(v).toLocaleString('es-CL');
const fD1=v=>v==null?'—':v.toFixed(1).replace('.',',');
const fDate=d=>d?`${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`:'—';
const ym=d=>d?`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`:null;
const ymLabel=k=>{const[y,m]=k.split('-');return new Date(+y,+m-1,1).toLocaleDateString('es-CL',{month:'short',year:'2-digit'});};
function pd(s){if(!s)return null;const m=String(s).match(/(\d{4})-(\d{2})-(\d{2})/);return m?new Date(+m[1],+m[2]-1,+m[3]):null;}
function lsGet(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function pctColor(v){if(v==null)return '#cbd5e1';if(v>=90)return '#15803d';if(v>=70)return '#b7791f';return '#c62828';}
function pbar(v){return `<div class="pbar"><span>${fP(v)}</span><div class="b"><i style="width:${v==null?0:Math.min(v,100)}%;background:${pctColor(v)}"></i></div></div>`;}
function pill(e){return `<span class="pill" style="background:${E_CLR[e]||'#94a3b8'}">${esc(e)}</span>`;}
function status(id,msg,err){const el=$(id);el.textContent=msg;el.classList.toggle('err',!!err);}

// ════════════════════════════════════════════════════════════
// MONDAY API
// ════════════════════════════════════════════════════════════
async function gql(query,tries=0){
  // sin caché: el proxy y el navegador no deben devolver respuestas antiguas
  const url=ST.proxy?'https://corsproxy.io/?url='+encodeURIComponent(API+'?_='+Date.now()):API;
  let r;
  try{
    r=await fetch(url,{method:'POST',cache:'no-store',headers:{'Content-Type':'application/json','Authorization':ST.key,'API-Version':API_VER,'Cache-Control':'no-cache'},body:JSON.stringify({query})});
  }catch(e){
    throw new Error('No se pudo conectar con Monday.com (red o bloqueo CORS).'+(location.protocol==='file:'?' Estás abriendo el archivo localmente: súbelo a GitHub Pages / un servidor web, o activa el proxy.':''));
  }
  if((r.status===429||r.status>=500)&&tries<3){await sleep(8000*(tries+1));return gql(query,tries+1);}
  let j;try{j=await r.json();}catch(e){throw new Error('Respuesta inválida de Monday (HTTP '+r.status+')');}
  const errs=j.errors||(j.error_message?[{message:j.error_message}]:null);
  if(errs){
    const msg=errs.map(e=>e.message).join(' · ');
    if(/complexity|rate limit|budget|too many/i.test(msg)&&tries<3){
      const m=msg.match(/(\d+)\s*seconds?/i);
      await sleep(((m?+m[1]:15)+1)*1000);
      return gql(query,tries+1);
    }
    throw new Error(msg);
  }
  if(!r.ok)throw new Error('HTTP '+r.status);
  return j.data;
}

async function fetchWorkspaces(){
  const d=await gql('query{ workspaces(limit:500){ id name kind } }');
  return (d.workspaces||[]).filter(w=>w&&w.id).sort((a,b)=>a.name.localeCompare(b.name,'es'));
}

// Carpetas de los espacios: id → {name, parent}. Si falla, se sigue sin carpetas.
async function fetchFolders(wsIds){
  const map={};
  try{
    for(let page=1;page<20;page++){
      const d=await gql(`query{ folders(workspace_ids:[${wsIds.join(',')}], limit:100, page:${page}){ id name parent{ id } } }`);
      const f=d.folders||[];
      f.forEach(x=>map[String(x.id)]={name:x.name,parent:x.parent?String(x.parent.id):null});
      if(f.length<100)break;
    }
    return {map,ok:true};
  }catch(e){console.warn('[folders]',e.message);return {map,ok:false};}
}
// Ruta completa de carpetas (incluye carpetas padre) → "Postergados / 2025"
function folderPath(id,map){
  const parts=[];let cur=id?String(id):null,guard=0;
  while(cur&&map[cur]&&guard++<10){parts.unshift(map[cur].name);cur=map[cur].parent;}
  return parts.join(' / ');
}
const RE_POST_NAME=/\bPOST\b|POSTERGAD/i;   // "… (2025) POST", "… POST Parte 2", "… - POST", "Postergado"
const RE_POST_FOLDER=/POSTERGAD|\bPOST\b/i;  // carpeta "POSTERGADOS", "Postergado", "POST"

async function fetchBoards(wsIds){
  const out=[];
  for(let page=1;page<50;page++){
    const d=await gql(`query{ boards(workspace_ids:[${wsIds.join(',')}], limit:200, page:${page}, state:active){ id name type items_count board_folder_id workspace{ id name } } }`);
    const b=d.boards||[];
    out.push(...b);
    if(b.length<200)break;
  }
  const {map,ok}=await fetchFolders(wsIds);
  ST.foldersOk=ok;
  return out.filter(b=>b.type!=='sub_items_board'&&b.type!=='document'&&!/^subelementos de/i.test(b.name)).map(b=>{
    const folder=folderPath(b.board_folder_id,map);
    const postName=RE_POST_NAME.test(b.name);
    const postFolder=!!folder&&RE_POST_FOLDER.test(folder);
    return {...b,...parseBoardName(b.name),folder,postName,postFolder,post:postName||postFolder};
  });
}

const CV_FRAG=`column_values{ id type text
  ... on StatusValue{ label }
  ... on DropdownValue{ values{ label } }
  ... on DateValue{ date }
  ... on TimelineValue{ from to }
  ... on MirrorValue{ display_value }
}`;
const ITEM_FRAG=`id name group{ id title } ${CV_FRAG}`;

async function fetchItems(boardIds,onProgress){
  const rows=[];
  const batchSize=Math.max(1,Math.min(25,parseInt($('#batch').value)||5));
  const batches=[];for(let i=0;i<boardIds.length;i+=batchSize)batches.push(boardIds.slice(i,i+batchSize));
  let done=0;
  for(const ids of batches){
    const d=await gql(`query{ boards(ids:[${ids.join(',')}]){ id name workspace{ id name } columns{ id title type } items_page(limit:${PAGE}){ cursor items{ ${ITEM_FRAG} } } } }`);
    for(const b of d.boards||[]){
      let items=[...b.items_page.items];
      let cursor=b.items_page.cursor;
      while(cursor){                                    // paginación completa
        const n=await gql(`query{ next_items_page(cursor:${JSON.stringify(cursor)}, limit:${PAGE}){ cursor items{ ${ITEM_FRAG} } } }`);
        items.push(...n.next_items_page.items);
        cursor=n.next_items_page.cursor;
      }
      rows.push(...normalizeBoard(b,items));
      done++;onProgress(done,boardIds.length,b.name);
    }
  }
  return rows;
}

// NORMALIZACIÓN
// ════════════════════════════════════════════════════════════
function parseBoardName(n){
  const year=(n.match(/\((\d{4})\)/)||[])[1]||'Sin año';
  const tipo=(n.match(/\[([^\]]+)\]/)||[])[1]||'';
  const proj=(n.split(/\s\[/)[0]||n).trim();
  const isProj=/\[[^\]]+\]\s*\(\d{4}\)/.test(n);
  return {year,tipo,proj,isProj};
}

function resolveCols(cols){
  const DT=['timeline','date'];
  const exact=(names,types)=>{for(const nm of names){const c=cols.find(c=>norm(c.title)===nm&&(!types||types.includes(c.type)));if(c)return c.id;}return null;};
  const inc=(subs,types,not=[])=>{const c=cols.find(c=>{const t=norm(c.title);return subs.some(s=>t.includes(s))&&!not.some(s=>t.includes(s))&&(!types||types.includes(c.type));});return c?c.id:null;};
  return{
    plan:  exact(['proyectado','planificado','plan','fecha plan','fecha planificada','plazo planificado'],DT)||inc(['proyect','planific','plan'],DT,['real','pai']),
    realIni:exact(['fecha inicio real','fecha de inicio real','inicio real'],DT)||inc(['inicio real'],DT),
    realFin:exact(['fecha termino real','fecha de termino real','termino real','fecha fin real','fin real'],DT)||inc(['termino real','fin real'],DT),
    real:  exact(['real','fecha real','ejecutado','fecha ejecucion','ejecucion real'],DT)||inc(['real','ejecut'],['timeline'],['inicio','termino','fin ']),
    etapa: exact(['etapa'])||inc(['etapa']),
    area:  exact(['area'])||inc(['area']),
    resp:  exact(['responsable','persona','owner'])||inc(['responsable']),
    avance:exact(['avance','estado','status'],['status','color'])||exact(['avance','estado']),
    generico:exact(['nombre generico','tarea','nombre generico tarea'])||inc(['generico']),
    plazoEst:exact(['plazo estandar','plazo estandard','plazo estandar (dias)','plazo estandard (dias)'])||inc(['plazo estand']),
  };
}

function cvText(cv){
  if(!cv)return '';
  if(cv.label!=null&&cv.label!=='')return String(cv.label);
  if(cv.values&&cv.values.length)return cv.values.map(v=>v.label).filter(Boolean).join(', ');
  if(cv.display_value)return String(cv.display_value);
  const t=(cv.text||'').trim();
  if((cv.type==='status'||cv.type==='color')&&/^\d+$/.test(t))return '';
  return t;
}
function cvDates(cv){
  if(!cv)return[null,null];
  if(cv.from||cv.to)return[pd(cv.from),pd(cv.to||cv.from)];
  if(cv.date)return[pd(cv.date),pd(cv.date)];
  const m=(cv.text||'').match(/\d{4}-\d{2}-\d{2}/g);
  return m?[pd(m[0]),pd(m[m.length-1])]:[null,null];
}
// Etapa canónica conservando el número de etapa repetida: "Enlace Operacional 2", "EO2", "EO 2" → "Enlace Operacional 2"
function etapaOf(s){
  const n=norm(s);if(!n)return null;
  let base=null,num='';
  const code=n.match(/^(dp|do|pc|eo)\s*(\d+)?$/);
  if(code){base={dp:0,do:1,pc:2,eo:3}[code[1]];num=code[2]||'';}
  else{
    const K=[[0,/definic\w*(?:\s+(?:de|del)?\s*proyecto)?/],[1,/diseno(?:\s+operativo)?/],[2,/preparac\w*(?:\s+(?:de|del)?\s*campana)?/],[3,/enlace(?:\s+operacional)?/]];
    for(const[i,re]of K){const m=n.match(new RegExp(re.source+'\\s*(?:n[°ºo.]?\\s*)?(\\d+)?\\b'));if(m){base=i;num=m[1]||'';break;}}
  }
  if(base==null)return null;
  return ETAPAS[base]+(num?' '+num:'');
}
const isPlanEt=e=>ETAPAS.some(b=>e===b||String(e).startsWith(b+' '));
function etRank(e){const i=ETAPAS.findIndex(b=>e===b||String(e).startsWith(b+' '));if(i<0)return 9999;const m=String(e).slice(ETAPAS[i].length).match(/\d+/);return i*100+(m?+m[0]:1);}
const etSort=(a,b)=>etRank(a)-etRank(b)||String(a).localeCompare(String(b),'es');

function normalizeBoard(b,items){
  const C=resolveCols(b.columns||[]);
  const ttl=id=>{const c=(b.columns||[]).find(c=>c.id===id);return c?c.title:null;};
  ST.boardCols[b.id]={board:b.name,plan:ttl(C.plan),realIni:ttl(C.realIni),realFin:ttl(C.realFin),real:ttl(C.real),avance:ttl(C.avance),etapa:ttl(C.etapa),generico:ttl(C.generico),plazoEst:ttl(C.plazoEst)};
  const meta=parseBoardName(b.name);
  const wsName=b.workspace?.name||'—';
  return items.map(it=>{
    const cv={};(it.column_values||[]).forEach(v=>cv[v.id]=v);
    const etapaRaw=cvText(cv[C.etapa]);
    const avance=cvText(cv[C.avance])||'Sin estado';
    const [pIni,pFin]=cvDates(cv[C.plan]);
    const [tIni,tFin]=cvDates(cv[C.real]);            // timeline "Real" (respaldo)
    const rIni=C.realIni?cvDates(cv[C.realIni])[0]:tIni;
    const rFin=C.realFin?cvDates(cv[C.realFin])[1]:tFin;
    const a=norm(avance);
    const excl=EXCL.includes(a);
    const done=!excl&&DONE.some(d=>a===d||a.startsWith(d+' ')||a===d);
    const r={
      boardId:b.id,board:b.name,ws:wsName,year:meta.year,tipo:meta.tipo,proj:meta.proj,
      group:it.group?.title||'',itemId:it.id,item:it.name,
      etapa:etapaOf(etapaRaw)||etapaOf(it.group?.title)||etapaOf(b.name)||etapaRaw||'Sin etapa',
      area:cvText(cv[C.area])||'Sin área',
      resp:cvText(cv[C.resp])||'Sin responsable',
      avance,excl,done,planIni:pIni,planFin:pFin,realIni:rIni,realFin:rFin,
      hasPlanCol:!!C.plan,hasRealCol:!!(C.real||C.realIni||C.realFin),
      etapaCol:etapaRaw,generico:cvText(cv[C.generico]),
      areaCol:cvText(cv[C.area]),respCol:cvText(cv[C.resp]),
      plazoEst:(()=>{const t=cvText(cv[C.plazoEst]).replace(',','.');const n=parseFloat(t);return isNaN(n)?null:n;})(),
      has:{etapa:!!C.etapa,generico:!!C.generico,plazoEst:!!C.plazoEst,area:!!C.area,resp:!!C.resp},
    };
    classify(r);
    r.mes=ym(r.planFin)||'Sin fecha';
    r._h=norm([r.proj,r.board,r.group,r.item,r.generico,r.etapa,r.area,r.resp,r.avance,r.estado].join(' '));
    return r;
  });
}

function classify(r){
  r.dias=null;
  if(r.excl){r.estado='Excluida';return;}
  if(r.done){
    if(r.planFin&&r.realFin){
      const d=Math.round((r.realFin-r.planFin)/DAY);
      if(d<=0){r.estado=E.OK;r.dias=0;}else{r.estado=E.LATE;r.dias=d;}
    }else r.estado=E.DNE;
    return;
  }
  if(!r.planFin){r.estado=E.ND;return;}
  const d=Math.round((TODAY-r.planFin)/DAY);
  if(d>0){r.estado=E.OVER;r.dias=d;}
  else if(d>=-7)r.estado=E.SOON;
  else r.estado=E.PLAZO;
}

function passes(r,skip,ignorePlan){

const DFIELDS=[
  {k:'periodo',l:'Período planificado',d:'Actividades cuyo plan (inicio → fin) se cruza con el rango'},
  {k:'planFin',l:'Fin plan',d:'Fecha de término planificada dentro del rango'},
  {k:'planIni',l:'Inicio plan',d:'Fecha de inicio planificada dentro del rango'},
  {k:'realIni',l:'Inicio real',d:'Fecha de inicio real dentro del rango'},
  {k:'realFin',l:'Fin real',d:'Fecha de término real dentro del rango'},
];
function inDateRange(r){
  const lo=F.from||new Date(-8.64e15),hi=F.to||new Date(8.64e15);
  if(F.dfield==='periodo'){
    const a=r.planIni||r.planFin,b=r.planFin||r.planIni;
    return !!a&&a<=hi&&b>=lo;
  }
  const v=r[F.dfield];return !!v&&v>=lo&&v<=hi;
}
function addD(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x;}
function presetRange(k){
  const t=new Date(TODAY),y=t.getFullYear(),m=t.getMonth();
  const mon=addD(t,-((t.getDay()+6)%7));                  // lunes de esta semana
  const q=Math.floor(m/3)*3;
  switch(k){
    case 'hoy':return[t,t];
    case 'sem':return[mon,addD(mon,6)];
    case 'semAnt':return[addD(mon,-7),addD(mon,-1)];
    case 'semSig':return[addD(mon,7),addD(mon,13)];
    case 'mes':return[new Date(y,m,1),new Date(y,m+1,0)];
    case 'mesAnt':return[new Date(y,m-1,1),new Date(y,m,0)];
    case 'mesSig':return[new Date(y,m+1,1),new Date(y,m+2,0)];
    case 'ult30':return[addD(t,-29),t];
    case 'prox30':return[t,addD(t,29)];
    case 'trim':return[new Date(y,q,1),new Date(y,q+3,0)];
    case 'anio':return[new Date(y,0,1),new Date(y,11,31)];
    case 'hasta':return[null,t];
  }
  return[null,null];
}

function newAgg(k){return{k,n:0,done:0,ok:0,late:0,dne:0,over:0,soon:0,plazo:0,nd:0,due:0,dueDone:0,delaySum:0,delayN:0,maxDelay:0,boards:new Set(),projs:new Set()};}
function addAgg(a,r){
  a.n++;a.boards.add(r.boardId);a.projs.add(r.proj);
  if(r.done)a.done++;
  switch(r.estado){case E.OK:a.ok++;break;case E.LATE:a.late++;break;case E.DNE:a.dne++;break;case E.OVER:a.over++;break;case E.SOON:a.soon++;break;case E.PLAZO:a.plazo++;break;default:a.nd++;}
  if(r.planFin&&r.planFin<=TODAY){a.due++;if(r.done)a.dueDone++;}
  if(r.dias>0){a.delaySum+=r.dias;a.delayN++;if(r.dias>a.maxDelay)a.maxDelay=r.dias;}
}
function finAgg(a){
  a.pending=a.n-a.done;
  a.pDone=pct(a.done,a.n);                     // % cumplimiento (realizadas / total)
  a.pOk=pct(a.ok,a.ok+a.late);                 // % a tiempo (de las realizadas evaluables)
  a.pPlan=pct(a.dueDone,a.due);                // cumplimiento del plan a la fecha
  a.pOver=pct(a.over,a.pending);               // % atrasadas de las pendientes
  a.avgDelay=a.delayN?a.delaySum/a.delayN:null;
  a.nb=a.boards.size;a.np=a.projs.size;
  return a;
}
function agg(rows,keyFn){
  const m=new Map();
  rows.forEach(r=>{const k=keyFn(r);if(!m.has(k))m.set(k,newAgg(k));addAgg(m.get(k),r);});
  return [...m.values()].map(finAgg);
}
function total(rows){const a=newAgg('TOTAL');rows.forEach(r=>addAgg(a,r));return finAgg(a);}

function tbl(id,cols,data,opts={}){
  const prev=TD[id];
  TD[id]={cols,data,opts,sort:prev?prev.sort:(opts.sort??null),dir:prev?prev.dir:(opts.dir??-1),page:0};
  return `<div id="w-${id}">${tblHTML(id)}</div>`;
}
function tblHTML(id){
  const t=TD[id];const{cols,opts}=t;
  let data=t.data;
  if(t.sort!=null){
    const k=t.sort;
    data=[...data].sort((a,b)=>{const x=a[k],y=b[k];
      if(x==null&&y==null)return 0;if(x==null)return 1;if(y==null)return -1;
      if(x instanceof Date||typeof x==='number')return (x-y)*t.dir;
      return String(x).localeCompare(String(y),'es')*t.dir;});
  }
  const ps=opts.pageSize||0;const pages=ps?Math.max(1,Math.ceil(data.length/ps)):1;
  if(t.page>=pages)t.page=pages-1;
  const view=ps?data.slice(t.page*ps,(t.page+1)*ps):data;
  let h=opts.info!==false?`<div class="tinfo">${fN(data.length)} filas</div>`:'';
  h+=`<div class="twrap" ${opts.maxH?`style="max-height:${opts.maxH}px"`:''}><table><thead><tr>`;
  cols.forEach(c=>{h+=`<th class="${c.num?'num':''} ${t.sort===c.k?'sorted':''}" data-k="${c.k}" ${c.t?`title="${esc(c.t)}"`:''}>${c.l}<span class="ar">${t.sort===c.k?(t.dir>0?'▲':'▼'):'⇅'}</span></th>`;});
  h+='</tr></thead><tbody>';
  if(!view.length)h+=`<tr><td colspan="${cols.length}" class="empty">Sin datos para los filtros aplicados</td></tr>`;
  view.forEach(r=>{h+='<tr>';cols.forEach(c=>{const v=r[c.k];h+=`<td class="${c.num?'num':''} ${c.wrap?'wrap':''}">${c.f?c.f(v,r):esc(v??'—')}</td>`;});h+='</tr>';});
  h+='</tbody>';
  if(opts.foot){h+='<tfoot><tr>';cols.forEach(c=>{const v=opts.foot[c.k];h+=`<td class="${c.num?'num':''}">${v===undefined?'':(c.f?c.f(v,opts.foot):esc(v))}</td>`;});h+='</tr></tfoot>';}
  h+='</table></div>';
  if(ps&&pages>1)h+=`<div class="pager"><button class="btn sm" data-pg="-1" ${t.page===0?'disabled':''}>‹ Anterior</button>Página ${t.page+1} de ${pages}<button class="btn sm" data-pg="1" ${t.page>=pages-1?'disabled':''}>Siguiente ›</button></div>`;
  return h;
}
document.addEventListener('click',e=>{
  const w=e.target.closest('[id^="w-"]');if(!w)return;
  const id=w.id.slice(2);const t=TD[id];if(!t)return;
  const th=e.target.closest('th[data-k]');
  if(th){const k=th.dataset.k;if(t.sort===k)t.dir*=-1;else{t.sort=k;t.dir=-1;}t.page=0;w.innerHTML=tblHTML(id);return;}
  const pg=e.target.closest('[data-pg]');
  if(pg){t.page+=+pg.dataset.pg;w.innerHTML=tblHTML(id);}
});

function stackedByEstado(id,rows,keyFn,keys,field,horizontal){

// ════════════════════════════════════════════════════════════
// ALERTAS DE DESVIACIÓN — una fila por tarea, lista para evaluar,
// notificar y corregir. Compara plan vs «Fecha Inicio Real» /
// «Fecha Término Real», estado de cierre y Plazo Estándar.
// ════════════════════════════════════════════════════════════
const S={REV:'Revisar',ATR:'Atrasada',FDP:'Fuera de plazo',OK:'OK'};
const S_ORDER=[S.REV,S.ATR,S.FDP,S.OK];
const S_N={[S.REV]:4,[S.ATR]:3,[S.FDP]:2,[S.OK]:1};
const S_CLR={[S.REV]:'#ea6a0c',[S.ATR]:'#c62828',[S.FDP]:'#b7791f',[S.OK]:'#15803d'};
const S_DESC={[S.REV]:'Datos faltantes o inconsistentes: corregir en Monday',[S.ATR]:'Fecha plan vencida sin inicio o sin cierre',[S.FDP]:'Cerrada o iniciada después de lo planificado, o plazo real sobre el estándar',[S.OK]:'Sin observaciones'};
const AL={tol:lsGet('ed_tol',0),habiles:lsGet('ed_habiles',true),status:new Set([S.REV,S.ATR,S.FDP]),motivos:new Set()};
const dd=(a,b)=>Math.round((a-b)/DAY);
// días hábiles (lun–vie) entre a y b, ambos inclusive
function wdays(a,b){if(!a||!b||b<a)return 0;let n=0;const d=new Date(a);while(d<=b){const w=d.getDay();if(w&&w<6)n++;d.setDate(d.getDate()+1);}return n;}
// días de atraso de "late" respecto de "early" (0 si no hay atraso)
function lag(late,early){if(!late||!early||late<=early)return 0;if(!AL.habiles)return dd(late,early);const s=new Date(early);s.setDate(s.getDate()+1);return wdays(s,late);}
function plazoReal(r){if(!r.realIni||!r.realFin||r.realFin<r.realIni)return null;return AL.habiles?wdays(r.realIni,r.realFin):dd(r.realFin,r.realIni)+1;}

const EV=new Map();   // caché por tarea (se limpia al cambiar parámetros)
function evalTask(r){
  const key=r.itemId+'|'+AL.tol+'|'+AL.habiles;
  if(EV.has(key))return EV.get(key);
  const tol=Math.max(0,+AL.tol||0);
  const rev=[],atr=[],fdp=[];
  const {planIni:pI,planFin:pF,realIni:rI,realFin:rF,done}=r;
  const enEjec=norm(r.avance).startsWith('en ejecucion');
  // ── Revisar: datos que deben corregirse ──
  if(r.has.generico&&!r.generico)rev.push('Sin Nombre Genérico');
  if(r.has.etapa&&!r.etapaCol)rev.push('Sin etapa');
  if(r.has.area&&!r.areaCol)rev.push('Sin área');
  if(r.has.resp&&!r.respCol)rev.push('Sin responsable');
  if(r.has.plazoEst&&r.plazoEst==null)rev.push('Sin plazo estándar');
  if(!pI&&!pF)rev.push('Sin fechas planificadas');
  if(done&&!rI&&!rF)rev.push('Cerrada sin fechas reales');
  else if(done&&!rF)rev.push('Cerrada sin término real');
  if(rF&&!rI)rev.push('Término real sin inicio real');
  if(rF&&rI&&rF<rI)rev.push('Término real anterior al inicio real');
  if((rI&&rI>TODAY)||(rF&&rF>TODAY))rev.push('Fecha real futura');
  if(!done&&rF&&rF<=TODAY)rev.push('Con término real pero sin cerrar');
  if(enEjec&&!rI)rev.push('En ejecución sin inicio real');
  // ── Atrasada: plan vencido ──
  if(!done&&!rI&&!rF&&pI){const d=lag(TODAY,pI);if(d>tol)atr.push(`No iniciada (${d} d desde inicio plan)`);}
  if(!done&&!rF&&pF){const d=lag(TODAY,pF);if(d>tol)atr.push(`Término plan vencido hace ${d} d`);}
  // ── Fuera de plazo ──
  if(rI&&pI){const d=lag(rI,pI);if(d>tol)fdp.push(`Inició ${d} d tarde`);}
  if(rF&&pF){const d=lag(rF,pF);if(d>tol)fdp.push(`Terminó ${d} d tarde`);}
  const pr=plazoReal(r);
  const kpi=r.plazoEst?((pr??0)-r.plazoEst)/r.plazoEst*100:null;
  if(pr!=null&&r.plazoEst&&pr>r.plazoEst+tol)fdp.push(`Plazo real ${pr} d vs estándar ${r.plazoEst} d`);
  const status=rev.length?S.REV:atr.length?S.ATR:fdp.length?S.FDP:S.OK;
  const motivos=[...rev,...atr,...fdp];
  const maxLag=Math.max(0,...[...atr,...fdp].map(m=>+(m.match(/(\d+) d/)||[])[1]||0));
  const out={status,motivos,rev,atr,fdp,plazoReal:pr,kpi,maxLag};
  EV.set(key,out);return out;
}
// tipo de motivo sin números (para filtrar)
const MT=[['No iniciada','No iniciada'],['Término plan vencido','Término plan vencido'],['Inició','Inició tarde'],['Terminó','Terminó tarde'],['Plazo real','Plazo real sobre el estándar']];
const motivoTipo=m=>{const t=MT.find(([p])=>m.startsWith(p));return t?t[1]:m;};

function alrRows(){
  return FRA.map(r=>{const e=evalTask(r);return{...r,...e,statusN:S_N[e.status],motivo:e.motivos.join(' · '),tipos:e.motivos.map(motivoTipo),tarea:r.generico||''};});
}
function alrFiltered(){
  return alrRows().filter(x=>AL.status.has(x.status)&&(!AL.motivos.size||x.tipos.some(t=>AL.motivos.has(t))));
}
function alTol(v){AL.tol=Math.max(0,parseInt(v)||0);lsSet('ed_tol',AL.tol);EV.clear();refresh();}
function alDias(v){AL.habiles=v==='h';lsSet('ed_habiles',AL.habiles);EV.clear();refresh();}

    .map(d=>({...d,ok:(!d.plan||!d.realIni||!d.realFin||!d.avance||!d.plazoEst)?'Incompleto':'Completo'}));
  return `<div class="tinfo">Columnas que usa la evaluación en cada tablero. Si una falta, las alertas de ese tablero quedan incompletas.</div>
    ${tbl('alrD',[{k:'ok',l:'Estado',f:v=>`<span class="pill" style="background:${v==='Completo'?'#15803d':'#ea6a0c'}">${v}</span>`},
      {k:'board',l:'Tablero',wrap:1},{k:'plan',l:'Planificación',f:miss},{k:'realIni',l:'Fecha Inicio Real',f:miss},{k:'realFin',l:'Fecha Término Real',f:miss},
      {k:'avance',l:'Avance',f:miss},{k:'plazoEst',l:'Plazo Estándar',f:miss},{k:'etapa',l:'Etapa',f:miss},{k:'generico',l:'Nombre Genérico',f:miss}],
      diag,{sort:'ok',dir:1})}`;
}
function alertsAOA(rows){
  return [['Tarea (Nombre Genérico)','Elemento','Group Name','Área','Etapa','Proyecto','Responsable','Avance','Inicio Plan','Fin Plan','Inicio Real','Fin Real','Status Tarea','Plazo Estándar','Plazo Real','KPI %','Motivo / acción','Link Monday'],
    ...[...rows].sort((a,b)=>b.statusN-a.statusN||b.maxLag-a.maxLag).map(x=>[x.generico,x.item,x.group,x.areaCol,x.etapaCol,x.board,x.respCol,x.avance,x.planIni,x.planFin,x.realIni,x.realFin,x.status,x.plazoEst,x.plazoReal,x.kpi==null?null:Math.round(x.kpi*10)/10,x.motivo,itemUrl(x)])];
}
function exportAlerts(){
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(alertsAOA(alrFiltered())),'Alertas');
  XLSX.writeFile(wb,`Alertas_Desviacion_${new Date().toISOString().slice(0,10)}.xlsx`,{cellDates:true});
}

// ════════════════════════════════════════════════════════════
// EXCEL
// ════════════════════════════════════════════════════════════
function exportXL(){
  const wb=XLSX.utils.book_new();
  const add=(name,aoa)=>XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(aoa),name.slice(0,31));
  const r1=v=>v==null?null:Math.round(v*10)/10;
  const T=total(FR);
  add('Resumen',[['Indicador','Valor'],['Fecha de corte',fDate(TODAY)],['Actividades',T.n],['Proyectos',T.np],['Tableros',T.nb],
    ['% Cumplimiento',r1(T.pDone)],['% Realizadas a tiempo',r1(T.pOk)],['Cumplimiento plan a la fecha (%)',r1(T.pPlan)],
    ['Atrasadas pendientes',T.over],['Por vencer ≤7 días',T.soon],['Cumplidas con atraso',T.late],['Atraso promedio (días)',r1(T.avgDelay)],['Atraso máximo (días)',T.maxDelay]]);
  const H=['Actividades','Realizadas','% Cumplimiento','% A tiempo','Cumpl. plan a la fecha %','Atrasadas','Cumpl. con atraso','Atraso prom. (d)','Atraso máx. (d)'];
  const mr=a=>[a.n,a.done,r1(a.pDone),r1(a.pOk),r1(a.pPlan),a.over,a.late,r1(a.avgDelay),a.maxDelay];
  add('Proyectos',[['Proyecto',...H],...agg(FR,r=>r.proj).map(a=>[a.k,...mr(a)])]);
  add('Áreas',[['Área',...H],...agg(FR,r=>r.area).map(a=>[a.k,...mr(a)])]);
  add('Responsables',[['Responsable',...H],...agg(FR,r=>r.resp).map(a=>[a.k,...mr(a)])]);
  const det=rs=>[['Proyecto','Año','Tablero','Grupo','Etapa','Actividad','Área','Responsable','Avance','Inicio plan','Fin plan','Inicio real','Fin real','Días atraso','Estado plazo'],
    ...rs.map(r=>[r.proj,r.year,r.board,r.group,r.etapa,r.item,r.area,r.resp,r.avance,r.planIni,r.planFin,r.realIni,r.realFin,r.dias,r.estado])];
  add('Atrasos',det(FR.filter(r=>r.estado===E.OVER||r.estado===E.LATE).sort((a,b)=>(b.dias||0)-(a.dias||0))));
  add('Alertas',alertsAOA(alrRows()));
  add('Detalle',det(FR));
  XLSX.writeFile(wb,`Dashboard_Ejecutivo_${new Date().toISOString().slice(0,10)}.xlsx`,{cellDates:true});
}
</script>
